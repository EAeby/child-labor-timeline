<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Child Labor Law Timeline</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #151d33;
    --line: #2a3553;
    --ink: #f2f5fb;
    --muted: #9ba8c4;
    --leg: #4d8dff;   /* Legislative - Congress */
    --exe: #f4ac3d;   /* Executive - President */
    --jud: #b582ff;   /* Judicial - Supreme Court */
    --ppl: #2ec4b0;   /* Citizens & events */
    --fs: clamp(13px, 1.05vw, 22px);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 30% -10%, #1a2547 0%, transparent 60%), var(--bg);
    color: var(--ink);
    font: 400 var(--fs)/1.35 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1em; padding: .9em 1.6em .5em;
  }
  h1 { font-size: 1.6em; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .95em; margin-top: .1em; }
  .controls { display: flex; gap: .9em; align-items: center; color: var(--muted); font-size: .8em; flex-wrap: wrap; justify-content: flex-end; }
  .controls label { display: flex; align-items: center; gap: .4em; cursor: pointer; user-select: none; }
  .controls input { width: 1.1em; height: 1.1em; accent-color: var(--exe); }
  .controls button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: .35em .8em; cursor: pointer;
  }
  .controls button:hover { border-color: var(--muted); }
  .hint kbd {
    font: inherit; font-size: .9em; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 .35em; color: var(--ink);
  }

  /* ---------- Video + side panel ---------- */
  .stage { display: flex; gap: 1.4em; padding: .5em 1.6em; min-height: 0; }
  .video-wrap {
    height: 100%; aspect-ratio: 16 / 9; max-width: 68%; flex: none;
    border-radius: 12px; overflow: hidden; background: #000;
    box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px var(--line);
    position: relative;
  }
  #player { width: 100%; height: 100%; display: block; border: 0; }
  .video-msg {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 2em; color: var(--muted);
  }
  .panel { flex: 1; min-width: 15em; display: flex; flex-direction: column; gap: .9em; min-height: 0; }

  .legend {
    display: grid; grid-template-columns: 1fr 1fr; gap: .45em .9em;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .8em 1em;
    font-size: .85em;
  }
  .legend .row { display: flex; align-items: center; gap: .5em; }
  .sw { width: .9em; height: .9em; border-radius: 50%; flex: none; background: var(--c); }
  .sw.bonus { background: transparent; border: 2px dashed rgba(255,255,255,.6); }
  .legend .row.full { grid-column: 1 / -1; color: var(--muted); }

  .card {
    flex: 1; min-height: 0; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    border-top: 5px solid var(--accent, var(--line));
    padding: 1em 1.2em;
  }
  .card.swap { animation: cardIn .5s ease-out; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card-year { font-size: 2.4em; font-weight: 800; line-height: 1; color: var(--accent, var(--ink)); }
  .card h2 { font-size: 1.3em; margin: .25em 0 .5em; line-height: 1.2; }
  .badges { display: flex; flex-wrap: wrap; gap: .4em; margin-bottom: .7em; }
  .badge {
    font-size: .78em; font-weight: 600; padding: .2em .65em; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .card p { color: #d9e0ee; }
  .bonus-note {
    margin-top: .8em; padding-top: .6em; border-top: 1px dashed var(--line);
    color: var(--muted); font-size: .85em;
  }
  .recap li { margin: .35em 0 .35em 1.1em; color: #d9e0ee; }
  .recap li b { color: var(--c); }
  .discuss {
    margin-top: .8em; padding: .6em .8em; border-radius: 8px;
    background: rgba(255,255,255,.05); font-size: .92em;
  }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; margin: .2em 1.6em .4em; height: 16em; }
  .track-area { position: absolute; left: 3.8em; right: 3.8em; top: 50%; }
  .track {
    position: absolute; left: 0; right: 0; top: -5px; height: 10px; border-radius: 5px;
    background: var(--line);
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #2f4a7a, #cfe0ff);
    transition: width .25s linear;
  }
  .head {
    position: absolute; top: 0; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 0 12px 4px rgba(190,215,255,.7);
    transition: left .25s linear;
  }
  .end { position: absolute; top: 0; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
  .end.l { right: calc(100% + .7em); }
  .end.r { left: calc(100% + .7em); }

  .ms { position: absolute; top: 0; width: 0; height: 0; }
  .dot {
    position: absolute; width: 1.15em; height: 1.15em; left: -.575em; top: -.575em;
    border-radius: 50%; border: 2px solid #56627f; background: var(--bg);
    padding: 0; cursor: pointer; z-index: 2;
    transition: transform .4s ease, box-shadow .4s ease, background .3s;
  }
  .dot:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .ms.bonus .dot::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.35);
  }
  .ms.on .dot { border-color: var(--bg); background: var(--dotbg); box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  .ms.on.bonus .dot::after { border-color: rgba(255,255,255,.75); }
  .ms.current .dot {
    transform: scale(1.35);
    box-shadow: 0 0 0 2px #fff, 0 0 18px 5px var(--c1);
  }
  .ms.pop .dot { animation: pop 1s cubic-bezier(.2,.9,.3,1); }
  @keyframes pop {
    0% { transform: scale(1); }
    30% { transform: scale(2.7); }
    100% { transform: scale(1.35); }
  }
  .ring {
    position: absolute; width: 1.15em; height: 1.15em; left: -.575em; top: -.575em;
    border-radius: 50%; border: 3px solid var(--c1); opacity: 0; pointer-events: none; z-index: 1;
  }
  .ms.pop .ring { animation: ripple 1.1s ease-out; }
  @keyframes ripple {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(4.5); opacity: 0; }
  }

  .stem { position: absolute; left: -1px; width: 2px; background: rgba(255,255,255,.3); opacity: 0; transition: opacity .4s; }
  .label {
    position: absolute; left: 0; width: max-content; max-width: 9.5em; text-align: center;
    transform: translateX(calc(-50% + var(--shift, 0px)));
    opacity: 0; transition: opacity .5s;
  }
  .ms[data-lane="0"] { --stem: var(--stem0, .7em); }
  .ms[data-lane="1"] { --stem: var(--stem1, 4em); }
  .ms[data-side="above"] .stem  { bottom: .8em; height: var(--stem); }
  .ms[data-side="above"] .label { bottom: calc(.8em + var(--stem)); }
  .ms[data-side="below"] .stem  { top: .8em; height: var(--stem); }
  .ms[data-side="below"] .label { top: calc(.8em + var(--stem)); }
  .ms.on .stem, .ms.on .label { opacity: 1; }
  .label .yr { display: block; font-weight: 800; font-size: 1.05em; color: var(--c1); line-height: 1.15; }
  .label .nm { display: block; font-size: .85em; line-height: 1.2; color: #cfd7e8; }
  .ms.current .label .nm { color: #fff; font-weight: 600; }
  .ms.pop .label { animation: labelIn .6s ease-out; }
  @keyframes labelIn { from { opacity: 0; } to { opacity: 1; } }

  #dbg {
    position: fixed; right: .6em; bottom: .6em; background: rgba(0,0,0,.7); color: #9fe;
    font: 600 14px/1.2 Consolas, monospace; padding: .3em .6em; border-radius: 6px; display: none;
  }
  .banner {
    position: fixed; left: 50%; top: 1em; transform: translateX(-50%); z-index: 10;
    background: #5a2a14; border: 1px solid #c8683a; color: #ffe1cf; padding: .6em 1em; border-radius: 8px;
    max-width: 90vw; font-size: .9em;
  }

  @media (max-width: 800px) {
    body { height: auto; overflow: auto; display: block; }
    header { flex-direction: column; align-items: flex-start; padding: 1em 16px .5em; }
    .controls { justify-content: flex-start; }
    .stage { flex-direction: column; padding: .5em 16px; }
    .video-wrap { width: 100%; height: auto; max-width: none; }
    .panel { min-width: 0; }
    .timeline { margin: .5em 16px 1em; }
    .track-area { left: 2.6em; right: 2.6em; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>The History of Child Labor Law</h1>
    <div class="sub">How all three branches of government shaped the Fair Labor Standards Act (1938)</div>
  </div>
  <div class="controls">
    <span class="hint"><kbd>←</kbd> <kbd>→</kbd> jump between milestones</span>
    <label title="Pause the video at the extra Supreme Court and Congress facts that the video doesn't cover">
      <input type="checkbox" id="autopause" checked> Pause at bonus facts
    </label>
    <button id="fsBtn" type="button">Full screen (F)</button>
  </div>
</header>

<main class="stage">
  <div class="video-wrap">
    <div id="player"></div>
    <div class="video-msg" id="videoMsg">Loading video…</div>
  </div>
  <aside class="panel">
    <div class="legend">
      <div class="row"><span class="sw" style="--c:var(--leg)"></span>Legislative · Congress</div>
      <div class="row"><span class="sw" style="--c:var(--exe)"></span>Executive · President</div>
      <div class="row"><span class="sw" style="--c:var(--jud)"></span>Judicial · Supreme Court</div>
      <div class="row"><span class="sw" style="--c:var(--ppl)"></span>Citizens &amp; events</div>
      <div class="row full"><span class="sw bonus"></span>Dashed ring = bonus fact, not in the video</div>
    </div>
    <div class="card" id="card"></div>
  </aside>
</main>

<section class="timeline" id="timeline">
  <div class="track-area" id="trackArea">
    <span class="end l">1900</span>
    <span class="end r">1950</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="head" id="head"></div>
  </div>
</section>

<div id="dbg"></div>

<script>
/* =====================================================================
   EDIT HERE
   t        = seconds into the video when the milestone appears
   branches = any of: legislative, executive, judicial, people
   bonus    = true for facts the video doesn't cover (dashed ring)
   ===================================================================== */
const VIDEO_ID = "PShWUU14yZM";
const START_YEAR = 1900, END_YEAR = 1950;
const RECAP_AT = 119; // seconds: when the summary card appears
const STOP_AT = 126;  // seconds: video stops here (2:06), before the present-day section

const MILESTONES = [
  { t: 51, year: 1903, short: "Children's Crusade", title: "Mother Jones's Children's Crusade",
    branches: ["people"],
    text: "Mother Jones leads child mill workers on a march of about 100 miles to President Theodore Roosevelt's home, asking him to act. He won't meet them, but the march makes national news." },
  { t: 63, year: 1904, short: "Child Labor Committee", title: "National Child Labor Committee founded",
    branches: ["people"],
    text: "Citizens organize with two goals: a federal law ending child labor, and free public school for every child." },
  { t: 73, year: 1907, short: "First bill fails", title: "First federal bill defeated",
    branches: ["legislative"],
    text: "Senator Albert Beveridge proposes a national ban on goods made by child labor, but Congress does not pass it." },
  { t: 76, year: 1916, short: "Keating-Owen Act", title: "Keating-Owen Act",
    branches: ["legislative", "executive"], bonus: true,
    text: "Congress passes the first federal child labor law, and President Woodrow Wilson signs it. It bans shipping goods made by young children to other states." },
  { t: 79, year: 1918, short: "Hammer v. Dagenhart", title: "Hammer v. Dagenhart",
    branches: ["judicial"], bonus: true,
    text: "The Supreme Court strikes down the Keating-Owen Act, 5 to 4. It rules that Congress went beyond its power to regulate trade between states." },
  { t: 82, year: 1919, short: "Child Labor Tax", title: "Child Labor Tax Law",
    branches: ["legislative", "executive"], bonus: true,
    text: "Congress tries a different approach: a 10% tax on the profits of companies that hire children. President Wilson signs it." },
  { t: 85, year: 1922, short: "Bailey v. Drexel", title: "Bailey v. Drexel Furniture Co.",
    branches: ["judicial"], bonus: true,
    text: "The Supreme Court strikes down the child labor tax too, calling it a penalty disguised as a tax." },
  { t: 88, year: 1924, short: "Amendment proposed", title: "Child Labor Amendment proposed",
    branches: ["legislative"], bonus: true,
    text: "Congress proposes changing the Constitution to give itself power over child labor. Amendments skip the President and go to the states, but not enough states approved it." },
  { t: 91, year: 1936, short: "Walsh-Healey Act", title: "Walsh-Healey Public Contracts Act",
    branches: ["legislative", "executive"],
    text: "President Franklin D. Roosevelt signs a law setting safety rules, minimum wage, overtime pay, and child labor limits for companies working on government contracts." },
  { t: 100, year: 1938, short: "Fair Labor Standards Act", title: "Fair Labor Standards Act (FLSA)",
    branches: ["legislative", "executive"],
    text: "Congress passes and President Roosevelt signs the FLSA: a minimum wage, a 40-hour work week, and nationwide limits on child labor (age 16 for most jobs, 18 for dangerous ones)." },
  { t: 105, year: 1941, short: "U.S. v. Darby", title: "United States v. Darby",
    branches: ["judicial"], bonus: true,
    text: "The Supreme Court unanimously upholds the FLSA and overturns Hammer v. Dagenhart. This time, the law stands." },
  { t: 109, year: 1944, short: "World War II", title: "World War II",
    branches: ["people"],
    text: "With so many adults away at war, nearly 3 million children go back to work." },
  { t: 115, year: 1949, short: "FLSA amended", title: "FLSA amendments of 1949",
    branches: ["legislative", "executive"],
    text: "Congress strengthens the FLSA and President Harry Truman signs it, directly banning oppressive child labor." },
];

const BRANCH = {
  legislative: { name: "Legislative · Congress",     color: "var(--leg)" },
  executive:   { name: "Executive · President",      color: "var(--exe)" },
  judicial:    { name: "Judicial · Supreme Court",   color: "var(--jud)" },
  people:      { name: "Citizens & events",          color: "var(--ppl)" },
};

/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const trackArea = $("trackArea"), timeline = $("timeline"), fill = $("fill"), head = $("head"), card = $("card");
const autoPauseBox = $("autopause");

try { const v = localStorage.getItem("autopause"); if (v !== null) autoPauseBox.checked = v === "1"; } catch (e) {}
autoPauseBox.addEventListener("change", () => { try { localStorage.setItem("autopause", autoPauseBox.checked ? "1" : "0"); } catch (e) {} });

if (location.protocol === "file:") {
  const b = document.createElement("div");
  b.className = "banner";
  b.textContent = "YouTube may refuse to play when this file is opened directly. Double-click start.bat instead.";
  document.body.appendChild(b);
}

/* ---------- Build milestones ---------- */
function dotBackground(branches) {
  const cs = branches.map(b => BRANCH[b].color);
  if (cs.length === 1) return cs[0];
  const step = 100 / cs.length;
  return "linear-gradient(90deg," + cs.map((c, i) => `${c} ${i * step}% ${(i + 1) * step}%`).join(",") + ")";
}

MILESTONES.forEach((m, i) => {
  m.x = (m.year - START_YEAR) / (END_YEAR - START_YEAR);
  const el = document.createElement("div");
  el.className = "ms" + (m.bonus ? " bonus" : "");
  el.style.left = (m.x * 100) + "%";
  el.style.setProperty("--c1", BRANCH[m.branches[0]].color);
  el.style.setProperty("--dotbg", dotBackground(m.branches));
  el.dataset.side = "above"; el.dataset.lane = "0";
  el.innerHTML = `
    <span class="ring"></span>
    <button class="dot" type="button" aria-label="${m.year}: ${m.title}" title="${m.year}: ${m.title}"></button>
    <div class="stem"></div>
    <div class="label"><span class="yr">${m.year}</span><span class="nm">${m.short}</span></div>`;
  el.querySelector(".dot").addEventListener("click", () => seek(m.t));
  trackArea.appendChild(el);
  m.el = el; m.labelEl = el.querySelector(".label"); m.on = false;
});

/* ---------- Label layout: 2 lanes above, 2 below, no overlaps ---------- */
function layoutLabels() {
  const W = trackArea.clientWidth;
  const em = parseFloat(getComputedStyle(trackArea).fontSize);
  const margin = parseFloat(getComputedStyle(trackArea).left) || 3 * em;
  const lanes = { above: [[], []], below: [[], []] };
  const gap = em * 0.6;

  MILESTONES.forEach((m, i) => {
    const w = m.labelEl.offsetWidth;
    const x = m.x * W;
    // keep labels on screen
    let l = x - w / 2, shift = 0;
    if (l < -margin) shift = -margin - l;
    if (l + w > W + margin) shift = (W + margin) - (l + w);
    l += shift;
    const r = l + w;
    m.labelEl.style.setProperty("--shift", shift + "px");

    const order = i % 2 === 0
      ? [["above", 0], ["below", 0], ["above", 1], ["below", 1]]
      : [["below", 0], ["above", 0], ["below", 1], ["above", 1]];
    let pick = order.find(([s, n]) => lanes[s][n].every(([a, b]) => r + gap < a || l - gap > b)) || order[0];
    lanes[pick[0]][pick[1]].push([l, r]);
    m.el.dataset.side = pick[0];
    m.el.dataset.lane = String(pick[1]);
  });

  const h = (lane) => Math.max(0, ...MILESTONES.filter(m => m.el.dataset.lane === lane).map(m => m.labelEl.offsetHeight));
  const stem0 = em * 0.7, h0 = h("0"), h1 = h("1");
  const stem1 = stem0 + h0 + em * 0.5;
  timeline.style.setProperty("--stem0", stem0 + "px");
  timeline.style.setProperty("--stem1", stem1 + "px");
  const half = em * 0.8 + (h1 ? stem1 + h1 : stem0 + h0) + em * 0.3;
  timeline.style.height = (2 * half) + "px";
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layoutLabels, 120); });
layoutLabels();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutLabels);

/* ---------- Video time -> year ---------- */
const KEYS = [[0, START_YEAR], ...MILESTONES.map(m => [m.t, m.year]), [RECAP_AT, END_YEAR]];
function yearAt(t) {
  if (t <= KEYS[0][0]) return KEYS[0][1];
  for (let i = 1; i < KEYS.length; i++) {
    const [t1, y1] = KEYS[i];
    if (t <= t1) {
      const [t0, y0] = KEYS[i - 1];
      return y0 + (y1 - y0) * ((t - t0) / (t1 - t0 || 1));
    }
  }
  return END_YEAR;
}

/* ---------- Side card ---------- */
let cardKey = null;
function renderCard(key) {
  if (key === cardKey) return;
  cardKey = key;
  if (key === "intro") {
    card.style.setProperty("--accent", "var(--line)");
    card.innerHTML = `
      <h2>Watch for the milestones</h2>
      <p>As the video plays, the timeline below fills in from 1900 to 1950. Each dot is a turning point,
      and its color shows which branch of government acted.</p>
      <div class="discuss">Listen for when <b>Congress</b>, the <b>President</b>, and the <b>Supreme Court</b> each get involved.</div>`;
  } else if (key === "recap") {
    card.style.setProperty("--accent", "#cfe0ff");
    card.innerHTML = `
      <h2>How the three branches worked together</h2>
      <ul class="recap">
        <li style="--c:var(--leg)"><b>Legislative:</b> Congress wrote the laws in 1916, 1919, 1936, 1938, and 1949, and proposed an amendment in 1924.</li>
        <li style="--c:var(--exe)"><b>Executive:</b> Presidents Wilson, Franklin Roosevelt, and Truman signed them into law.</li>
        <li style="--c:var(--jud)"><b>Judicial:</b> The Supreme Court struck down two laws (1918, 1922), then upheld the FLSA in 1941.</li>
        <li style="--c:var(--ppl)"><b>Citizens:</b> Marches, journalists, and committees pushed the government to act.</li>
      </ul>
      <div class="discuss"><b>Think about it:</b> You can't vote yet, but voters choose the members of Congress and the
      President who make laws like these, and the President picks Supreme Court justices.</div>`;
  } else {
    const m = MILESTONES[key];
    card.style.setProperty("--accent", BRANCH[m.branches[0]].color);
    card.innerHTML = `
      <div class="card-year">${m.year}</div>
      <h2>${m.title}</h2>
      <div class="badges">${m.branches.map(b => `<span class="badge" style="--c:${BRANCH[b].color}">${BRANCH[b].name}</span>`).join("")}</div>
      <p>${m.text}</p>
      ${m.bonus ? `<div class="bonus-note">Bonus fact: not in the video. Added to show each branch's role.</div>` : ""}`;
  }
  card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap");
}
renderCard("intro");

/* ---------- Update loop ---------- */
let player = null, ready = false, ended = false;

function update(t, playing) {
  const pct = ((yearAt(t) - START_YEAR) / (END_YEAR - START_YEAR)) * 100;
  fill.style.width = pct + "%";
  head.style.left = pct + "%";

  let latest = -1;
  MILESTONES.forEach((m, i) => {
    const on = t >= m.t;
    if (on && !m.on) {
      m.on = true;
      m.el.classList.add("on");
      if (t - m.t < 1.5) {           // reached it just now, not by a big jump
        m.el.classList.remove("pop"); void m.el.offsetWidth; m.el.classList.add("pop");
        if (playing && m.bonus && autoPauseBox.checked) player.pauseVideo();
      }
    } else if (!on && m.on) {
      m.on = false;
      m.el.classList.remove("on", "current", "pop");
    }
    if (on) latest = i;
  });
  MILESTONES.forEach((m, i) => m.el.classList.toggle("current", i === latest));

  renderCard(ended || t >= RECAP_AT ? "recap" : (latest < 0 ? "intro" : latest));
}

function tick() {
  if (ready) {
    const t = player.getCurrentTime() || 0;
    const playing = player.getPlayerState() === 1;
    if (t >= STOP_AT) {                       // never play past the stop point
      if (playing) player.pauseVideo();
      if (t > STOP_AT + 0.5) player.seekTo(STOP_AT, true);
      ended = true;
    }
    update(t, playing);
    if (dbgOn) $("dbg").textContent = fmt(t);
  }
}

function seek(t) {
  if (!ready) return;
  ended = false;
  player.seekTo(t + 0.05, true);
}

/* ---------- YouTube player ---------- */
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    videoId: VIDEO_ID,
    playerVars: { rel: 0, playsinline: 1, fs: 0, modestbranding: 1, origin: location.origin },
    events: {
      onReady: () => { ready = true; $("videoMsg").remove(); },
      onStateChange: (e) => { if (e.data === 0) ended = true; else if (e.data === 1) ended = false; },
      onError: (e) => { $("videoMsg") && ($("videoMsg").textContent = "The video couldn't play (YouTube error " + e.data + ")."); },
    },
  });
};
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
s.onerror = () => { $("videoMsg").textContent = "Couldn't reach YouTube. Check the internet connection."; };
document.head.appendChild(s);
setInterval(tick, 50);   // a timer keeps running even if the window isn't focused

/* ---------- Keys & buttons ---------- */
let dbgOn = false;
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
$("fsBtn").addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", () => setTimeout(layoutLabels, 200));

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const t = ready ? player.getCurrentTime() : 0;
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  else if (e.key === "d" || e.key === "D") { dbgOn = !dbgOn; $("dbg").style.display = dbgOn ? "block" : "none"; }
  else if (e.key === " " && ready) {
    e.preventDefault();
    player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    const next = MILESTONES.find(m => m.t > t + 0.5);
    seek(next ? next.t : RECAP_AT);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    const prev = [...MILESTONES].reverse().find(m => m.t < t - 1);
    seek(prev ? prev.t : 0);
  }
});
</script>
